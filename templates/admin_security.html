{% extends 'base.html' %}{% block content %}<section class="section"><div class="eyebrow">ADMIN SECURITY</div><h1>Change Admin Login</h1><p class="muted">Update the administrator's display name, username and password.</p><form class="form" method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Current password</label><input type="password" name="current_password" autocomplete="current-password" required><label>Admin name</label><input type="text" name="name" value="{{user['name']}}" autocomplete="name" required><label>Admin username</label><input type="text" name="username" value="{{user['email']}}" autocomplete="username" required><label>New password</label><input type="password" name="new_password" minlength="8" autocomplete="new-password" required><label>Confirm new password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required><button class="primary">Save New Login Details</button></form><p class="muted">Use a strong password and keep the login details private.</p><p><a href="{{url_for('admin')}}">← Back to Admin Centre</a></p></section>{% endblock %}
