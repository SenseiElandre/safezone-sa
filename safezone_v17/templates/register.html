{% extends 'base.html' %}{% block content %}
<section class="section auth">
<div class="eyebrow">JOIN SAFEZONE SA</div><h1>Create your SafeZone</h1>
<p>Your town determines which community alerts and local safety resources you see.</p>
<form class="form" method="post">
<input type="hidden" name="_csrf" value="{{csrf_token}}">
<input name="name" placeholder="Full name" required>
<input name="email" type="email" placeholder="Email address" required>
<input name="password" type="password" placeholder="Password (8+ characters)" minlength="8" required>
<label>Your town</label>
<select name="area" id="town-select" onchange="toggleOtherTown()">
{% for t in towns %}<option value="{{t}}" {% if t=='Despatch' %}selected{% endif %}>{{t}}</option>{% endfor %}
</select>
<input name="other_area" id="other-town" placeholder="Enter your town" style="display:none">
<button class="primary">Create account</button>
</form></section>
<script>
function toggleOtherTown(){document.getElementById('other-town').style.display=document.getElementById('town-select').value==='Other'?'block':'none';}
</script>
{% endblock %}
